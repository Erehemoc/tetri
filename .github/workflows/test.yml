name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/core.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright opencv-python-headless && python -m playwright install --with-deps chromium
      - name: Browser test
        run: |
          python -m http.server 8765 &
          sleep 1
          python test/e2e.py
